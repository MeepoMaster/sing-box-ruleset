name: Update Sing-box Remote Rulesets

on:
  schedule:
    - cron: '30 0,8,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/block.txt'
      - 'source/noblock.txt'
      - 'source/process.txt'
      - 'source/cn.txt'
      - 'source/emby.json'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SB_REPO: https://github.com/reF1nd/sing-box.git
  SB_BRANCH: reF1nd-testing
  RULESET_VERSION_MAX: '5'
  PRODUCTS: 'emby app adg-awa adg-dns cn'
  AWA_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
  ADBLOCK_URL: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksingbox.json
  APPS_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/applications.json
  CN_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/cn.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'push' || (github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore: auto-update')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 克隆 reF1nd sing-box 并记录提交
        id: sb
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$SB_BRANCH" "$SB_REPO" /tmp/sb
          echo "rev=$(git -C /tmp/sb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ steps.sb.outputs.rev }}
          restore-keys: gobuild-

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/sb/go.mod
          cache: false

      - name: 编译 sing-box 并探测支持的规则集版本
        run: |
          set -euo pipefail
          cd /tmp/sb
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sing-box ./cmd/sing-box
          sudo install -m 0755 sing-box /usr/local/bin/sing-box
          sing-box version

          probe() {
            printf '{"version": %s, "rules": [{"domain": ["probe.example.com"], "domain_suffix": ["probe.example.com"], "domain_keyword": ["probe"], "ip_cidr": ["127.0.0.1"], "process_name": ["probe.exe"]}]}' "$1" > "$RUNNER_TEMP/probe.json"
            sing-box rule-set compile --output "$RUNNER_TEMP/probe.srs" "$RUNNER_TEMP/probe.json" >/dev/null 2>&1 && [ -s "$RUNNER_TEMP/probe.srs" ]
          }

          SUPPORTED=""
          for v in $(seq 1 "$RULESET_VERSION_MAX"); do
            if probe "$v"; then
              echo "  v$v ✅"
              SUPPORTED="$SUPPORTED $v"
            else
              echo "  v$v ❌"
            fi
            rm -f "$RUNNER_TEMP/probe.srs"
          done

          MAX=$(echo $SUPPORTED | tr ' ' '\n' | sort -n | tail -1)
          if [ -z "${MAX:-}" ]; then
            echo "❌ 该二进制不支持任何规则集版本（探测样本已含 process_name）"
            exit 1
          fi
          echo "本次生效版本：v$MAX"
          echo "EFFECTIVE_VERSION=$MAX" >> "$GITHUB_ENV"

      - name: 拉取上游规则集
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/up"
          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 90 -o "$dest.part" "$url" \
               && [ -s "$dest.part" ] && jq -e '(.rules | length) > 0' "$dest.part" >/dev/null 2>&1; then
              mv "$dest.part" "$dest"
              echo "✅ $(basename "$dest")"
            else
              rm -f "$dest.part"
              echo "⚠️ $(basename "$dest") 拉取或校验失败，将回退到上一次的产物"
            fi
          }
          fetch "$AWA_URL"     "$RUNNER_TEMP/up/awa.json"
          fetch "$ADBLOCK_URL" "$RUNNER_TEMP/up/adblock.json"
          fetch "$APPS_URL"    "$RUNNER_TEMP/up/applications.json"
          fetch "$CN_URL"      "$RUNNER_TEMP/up/cn.json"

      - name: 组装并归一化（只写临时目录）
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          TMP      = Path(os.environ["RUNNER_TEMP"])
          SRC      = Path("source")
          BUILD    = TMP / "build"
          UP       = TMP / "up"
          VER      = int(os.environ["EFFECTIVE_VERSION"])
          PRODUCTS = os.environ["PRODUCTS"].split()
          BUILD.mkdir(parents=True, exist_ok=True)

          LABEL = {"domain:": "domain", "domain：": "domain",
                   "domain_suffix:": "suffix", "domain_suffix：": "suffix",
                   "domain_keyword:": "keyword", "domain_keyword：": "keyword",
                   "domain_regex:": "regex", "domain_regex：": "regex"}
          TITLE = {"domain": "domain:", "suffix": "domain_suffix:",
                   "keyword": "domain_keyword:", "regex": "domain_regex:"}
          DOM_KEYS = ("domain", "domain_suffix", "domain_keyword", "domain_regex")
          WARN = {}

          def warn(name, msg):
              WARN.setdefault(name, []).append(msg)

          def load(p):
              with open(p, encoding="utf-8") as f:
                  return json.load(f)

          def dump(p, obj):
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          # ---------- TXT 解析与就地整理 ----------
          def parse_txt(p, default):
              groups = {"domain": [], "suffix": [], "keyword": [], "regex": []}
              cur, tagged = default, False
              if not Path(p).exists():
                  return groups, tagged
              for raw in Path(p).read_text(encoding="utf-8").splitlines():
                  s = raw.strip()
                  if not s or s.startswith("#"):
                      continue
                  hit = LABEL.get(s.lower())
                  if hit:
                      cur, tagged = hit, True
                      continue
                  groups[cur].append(s)
              return groups, tagged

          def tidy_hosts(name, default):
              p = SRC / name
              groups, tagged = parse_txt(p, default)
              if not groups["domain"] + groups["suffix"] + groups["keyword"] + groups["regex"]:
                  return {}
              out = {}
              for k in ("domain", "suffix", "keyword", "regex"):
                  vals = groups[k]
                  if not vals:
                      continue
                  out[k] = sorted(set(vals)) if k == "regex" else sorted({v.lower() for v in vals})
              bad = [v for k in ("domain", "suffix", "keyword") for v in out.get(k, [])
                     if re.search(r"[*^/\\: ]", v)]
              if bad:
                  warn(name, "疑似非法条目（含 * / ^ : 空格）：%s" % "、".join(bad[:5]))
              if tagged:
                  blocks = ["%s\n%s" % (TITLE[k], "\n".join(out[k]))
                            for k in ("domain", "suffix", "keyword", "regex") if out.get(k)]
                  p.write_text("\n\n".join(blocks) + "\n", encoding="utf-8")
              else:
                  p.write_text("\n".join(out.get(default, [])) + "\n", encoding="utf-8")
              return out

          def tidy_flat(name):
              p = SRC / name
              if not p.exists():
                  return []
              vals = sorted({l.strip() for l in p.read_text(encoding="utf-8").splitlines()
                             if l.strip() and not l.lstrip().startswith("#")})
              p.write_text("\n".join(vals) + "\n", encoding="utf-8")
              return vals

          # ---------- 归一化 ----------
          def covered(host, sufs):
              return any(host == s or host.endswith("." + s) for s in sufs)

          def norm_rule(rule, name):
              for k in DOM_KEYS:
                  if isinstance(rule.get(k), list):
                      rule[k] = sorted({str(x).strip() for x in rule[k] if str(x).strip()})
              sufs = rule.get("domain_suffix", [])
              if sufs:
                  rule["domain_suffix"] = sorted({s for s in sufs
                                                  if not any(s != t and s.endswith("." + t) for t in sufs)})
              kws = rule.get("domain_keyword", [])
              if kws:
                  rule["domain_keyword"] = sorted({t for t in kws
                                                   if not any(t != u and u in t for u in kws)})
              if rule.get("domain"):
                  drop = [d for d in rule["domain"]
                          if covered(d, rule.get("domain_suffix", []))
                          or any(k in d for k in rule.get("domain_keyword", []))]
                  if drop:
                      warn(name, "删除 %d 条被 suffix/keyword 覆盖的 domain：%s"
                           % (len(drop), "、".join(drop[:3])))
                  rule["domain"] = [d for d in rule["domain"] if d not in drop]
              for k in DOM_KEYS:
                  if k in rule and not rule[k]:
                      del rule[k]
              return rule

          def norm_doc(doc, name):
              if not doc.get("rules"):
                  doc["rules"] = [{}]
              for rule in doc["rules"]:
                  norm_rule(rule, name)
              doc["version"] = VER
              return doc

          # ---------- 合并 / 白名单 ----------
          def merge(rule, dom=None, suf=None, kw=None):
              for key, vals in (("domain", dom), ("domain_suffix", suf), ("domain_keyword", kw)):
                  if vals:
                      rule[key] = list(rule.get(key) or []) + list(vals)

          def whitelist(rule, nb_all):
              def hit(d):
                  return any(d == x or d.startswith(x + ".") for x in nb_all)
              for k in ("domain", "domain_suffix"):
                  if rule.get(k):
                      rule[k] = [d for d in rule[k] if not hit(d)]
              if rule.get("domain_keyword"):
                  rule["domain_keyword"] = [k for k in rule["domain_keyword"]
                                            if not any(x in k for x in nb_all)]

          def pick(name, ups):
              if ups and all((UP / u).is_file() for u in ups):
                  try:
                      return [load(UP / u) for u in ups], "upstream"
                  except Exception as e:
                      warn(name, "上游解析失败：%s" % e)
              prev = SRC / ("%s.json" % name)
              if prev.is_file():
                  warn(name, "上游不可用，回退到上一次产物（本次未更新上游内容）")
                  return [load(prev)], "previous"
              raise SystemExit("[%s] 上游与历史产物都不可用，无法生成" % name)

          def first_rule(doc):
              doc.setdefault("rules", [{}])
              return doc["rules"][0]

          # ---------- 各产物 ----------
          block    = tidy_hosts("block.txt", "domain")
          noblock  = tidy_hosts("noblock.txt", "domain")
          cn_local = tidy_hosts("cn.txt", "suffix")
          procs    = tidy_flat("process.txt")

          nb_all = (noblock.get("domain") or []) + (noblock.get("suffix") or []) + (noblock.get("keyword") or [])

          out = {}

          emby_path = SRC / "emby.json"
          if not emby_path.is_file():
              raise SystemExit("缺少 source/emby.json（手工维护的原始规则集）")
          doc = load(emby_path)
          norm_doc(doc, "emby")
          out["emby"] = (doc, "local")

          docs, origin = pick("adg-awa", ["awa.json"])
          doc = docs[0]; rule = first_rule(doc)
          merge(rule, block.get("domain"), block.get("suffix"), block.get("keyword"))
          whitelist(rule, nb_all)
          norm_doc(doc, "adg-awa")
          out["adg-awa"] = (doc, origin)

          docs, origin = pick("adg-dns", ["awa.json", "adblock.json"])
          if origin == "upstream" and len(docs) == 2:
              merged = {"rules": [{}]}
              for d in docs:
                  src_rule = first_rule(d)
                  for k in ("domain", "domain_suffix", "domain_keyword"):
                      if src_rule.get(k):
                          merged["rules"][0][k] = list(merged["rules"][0].get(k) or []) + src_rule[k]
              doc = merged
          else:
              doc = docs[0]; first_rule(doc)
          rule = doc["rules"][0]
          merge(rule, block.get("domain"), block.get("suffix"), block.get("keyword"))
          whitelist(rule, nb_all)
          norm_doc(doc, "adg-dns")
          out["adg-dns"] = (doc, origin)

          docs, origin = pick("app", ["applications.json"])
          doc = docs[0]; rule = first_rule(doc)
          if procs:
              exist = [str(x).strip() for x in (rule.get("process_name") or []) if str(x).strip()]
              rule["process_name"] = sorted(set(exist) | set(procs))
          norm_doc(doc, "app")
          out["app"] = (doc, origin)

          docs, origin = pick("cn", ["cn.json"])
          doc = docs[0]; rule = first_rule(doc)
          merge(rule, cn_local.get("domain"), cn_local.get("suffix"), cn_local.get("keyword"))
          norm_doc(doc, "cn")
          out["cn"] = (doc, origin)

          # ---------- 校验 + 落地到临时目录 ----------
          report = {}
          for name in PRODUCTS:
              if name not in out:
                  raise SystemExit("未知产物：%s" % name)
              doc, origin = out[name]
              rule = doc["rules"][0]
              cross = sum(1 for d in rule.get("domain", []) if covered(d, rule.get("domain_suffix", [])))
              if cross:
                  raise SystemExit("[%s] 归一化后仍有 %d 条 domain 被 domain_suffix 覆盖" % (name, cross))
              dump(BUILD / ("%s.json" % name), doc)
              report[name] = {"origin": origin,
                              "counts": {k: len(rule.get(k, [])) for k in DOM_KEYS},
                              "warnings": WARN.get(name, [])}

          dump(BUILD / "report.json", report)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: 校验产物并落盘到 source/
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          TMP   = Path(os.environ["RUNNER_TEMP"])
          BUILD = TMP / "build"
          SRC   = Path("source")
          rep = json.loads((BUILD / "report.json").read_text(encoding="utf-8"))

          origin_cn = {"upstream": "上游", "previous": "⚠️ 回退（旧产物）", "local": "本地"}
          rows = ["| 产物 | 来源 | domain | domain_suffix | domain_keyword | domain_regex |",
                  "| --- | --- | ---: | ---: | ---: | ---: |"]
          for name, info in rep.items():
              c = info["counts"]
              rows.append("| %s | %s | %d | %d | %d | %d |" % (
                  name, origin_cn.get(info["origin"], info["origin"]),
                  c["domain"], c["domain_suffix"], c["domain_keyword"], c["domain_regex"]))

          notes = ["- **%s**：%s" % (n, w) for n, i in rep.items() for w in i["warnings"]]
          md = ["## 规则集构建结果", "", *rows, ""]
          if notes:
              md += ["### 归一化提示", "", *notes, ""]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(md) + "\n")

          for name in rep:
              os.replace(BUILD / ("%s.json" % name), SRC / ("%s.json" % name))
          print("已落盘 %d 个 JSON" % len(rep))
          PY

      - name: 编译为 SRS
        run: |
          set -euo pipefail
          echo "===== sing-box ====="; sing-box version
          echo "===== 生效版本 v$EFFECTIVE_VERSION ====="
          {
            echo ""
            echo "### 编译结果"
            echo ""
            echo "| SRS | 大小(字节) | 结果 |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          for f in $PRODUCTS; do
            src="source/$f.json"
            if [ ! -f "$src" ]; then
              echo "❌ 缺少 $src"
              echo "| $f.srs | - | ❌ 源文件缺失 |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"; continue
            fi
            if sing-box rule-set compile --output "$f.srs" "$src" && [ -s "$f.srs" ]; then
              size=$(stat -c %s "$f.srs")
              echo "✅ $f.srs ($size 字节)"
              echo "| $f.srs | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $f 编译失败"
              echo "| $f.srs | - | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            echo "编译失败：$failed"
            exit 1
          fi

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          git add -f source/*.txt source/*.json ./*.srs
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: auto-update rulesets (v${EFFECTIVE_VERSION})"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "✅ 推送成功"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，3 秒后重试"
            sleep 3
          done
          echo "❌ 推送重试 5 次仍失败"
          exit 1
