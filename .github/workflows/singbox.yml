name: Update Singbox Remote Rules

on:
  # 1. 每天定时运行（北京时间 8:30, 16:30, 0:30）
  schedule:
    - cron: '30 0,8,16 * * *'
  # 2. 支持在 GitHub Actions 页面手动点击触发
  workflow_dispatch:
  # 3. 当你修改本地核心配置并推送到仓库时，立刻触发更新
  push:
    branches:
      - main  # ⚠️ 如果你的默认分支叫 master，请把这里改成 master，否则 push 触发永远不生效
    paths:
      # 只监听纯手工维护的源文件
      - 'source/emby.json'
      - 'source/block.txt'
      - 'source/noblock.txt'
      - 'source/process.txt'
      - 'source/cn.txt'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RULESET_VERSION: '5'

# 并发控制：防止同分支多个运行互相抢文件
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-all-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 0. 检出代码仓库
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 0.5 若由本工作流自身提交触发，直接跳过（防自触发空跑）
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          LAST_COMMITTER=$(git log -1 --format='%an')
          echo "本次 push 的提交作者: $LAST_COMMITTER"
          if [ "$LAST_COMMITTER" = "GitHub Action" ] || [ "$LAST_COMMITTER" = "github-actions[bot]" ]; then
            echo "这是工作流自己的提交，跳过本次运行（避免死循环/空跑）"
            exit 1
          fi
        fi

    - name: 1. 安装系统基础依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y jq wget tar

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 3. 克隆 reF1nd sing-box（testing 分支）
      run: |
        git clone --depth 1 -b reF1nd-testing https://github.com/reF1nd/sing-box.git /tmp/sb
        echo "克隆完成，分支存在则继续"

    - name: 4. 配置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version-file: /tmp/sb/go.mod
        cache: false

    - name: 5. 编译安装 Sing-box + 自检 v${{ env.RULESET_VERSION }} 支持
      run: |
        cd /tmp/sb
        CGO_ENABLED=0 go build -trimpath -o sing-box ./cmd/sing-box
        sudo mv sing-box /usr/local/bin/
        echo "===== sing-box 版本 ====="
        sing-box version
        echo "===== 自检：该二进制能否编译 rule-set v${{ env.RULESET_VERSION }} ====="
        echo "{\"version\": $RULESET_VERSION, \"rules\": [{\"domain_suffix\": [\"example.com\"]}]}" > /tmp/check_v5.json
        if sing-box rule-set compile --output /tmp/check_v5.srs /tmp/check_v5.json && [ -s /tmp/check_v5.srs ]; then
          echo "✅ 自检通过：该二进制支持 v${{ env.RULESET_VERSION }}，可以继续"
        else
          echo "❌ 自检失败：该二进制不支持 v${{ env.RULESET_VERSION }}（reF1nd 分支可能没装对，或版本号不对）"
          exit 1
        fi
        rm -f /tmp/check_v5.json /tmp/check_v5.srs

    - name: 6. 自动整理并去重本地 TXT 源文件
      run: |
        python3 -c '
        import os

        txt_files = ["source/block.txt", "source/noblock.txt", "source/process.txt", "source/cn.txt"]
        
        for file_path in txt_files:
            if not os.path.exists(file_path):
                continue

            with open(file_path, "r", encoding="utf-8") as f:
                lines = [line.strip() for line in f if line.strip()]

            if not lines:
                continue

            tags = {"domain:", "domain_suffix:", "domain_keyword:", "domain：", "domain_suffix：", "domain_keyword："}
            has_tags = any(line.lower() in tags for line in lines)

            out_str = ""

            if not has_tags:
                sorted_lines = sorted(list(set(lines)))
                out_str = "\n".join(sorted_lines)
            else:
                groups = {"domain": set(), "suffix": set(), "keyword": set()}
                current = "domain"

                for line in lines:
                    val = line.lower()
                    if val in ["domain:", "domain："]:
                        current = "domain"
                    elif val in ["domain_suffix:", "domain_suffix："]:
                        current = "suffix"
                    elif val in ["domain_keyword:", "domain_keyword："]:
                        current = "keyword"
                    else:
                        groups[current].add(line)

                out_blocks = []
                if groups["domain"]:
                    out_blocks.append("domain:\n" + "\n".join(sorted(list(groups["domain"]))))
                if groups["suffix"]:
                    out_blocks.append("domain_suffix:\n" + "\n".join(sorted(list(groups["suffix"]))))
                if groups["keyword"]:
                    out_blocks.append("domain_keyword:\n" + "\n".join(sorted(list(groups["keyword"]))))
                
                out_str = "\n\n".join(out_blocks)

            with open(file_path, "w", encoding="utf-8") as f:
                f.write(out_str + "\n")
        '

    - name: 7. 处理 Emby 规则（去重 + 排序 + 版本号）
      continue-on-error: true
      run: |
        jq --argjson version "$RULESET_VERSION" '
          .version = $version |
          .rules[] |= (
            if has("domain") then .domain |= (unique | sort) else . end |
            if has("domain_suffix") then .domain_suffix |= (unique | sort) else . end |
            if has("domain_keyword") then .domain_keyword |= (unique | sort) else . end
          )
        ' source/emby.json | jq . > source/temp_emby.json
        mv source/temp_emby.json source/emby.json

    - name: 8. 处理 adg-awa 规则
      continue-on-error: true
      run: |
        curl -sfL -o AWAvenue.json https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
        
        block_domains=$(grep -vE ':$|：$' source/block.txt | jq -R -s -c 'split("\n")[:-1] | map(select(length > 0))' || echo "[]")
        noblock_domains=$(grep -vE ':$|：$' source/noblock.txt | jq -R -s -c 'split("\n")[:-1] | map(select(length > 0))' || echo "[]")

        jq --argjson noblock "$noblock_domains" '
          .rules[0].domain |= map(select(. as $d | $noblock | index($d) | not)) |
          .rules[0].domain_keyword |= map(select(. as $d | $noblock | index($d) | not)) |
          .rules[0].domain_suffix |= map(select(. as $d | $noblock | index($d) | not))
        ' AWAvenue.json > cleaned_awa.json

        jq --argjson block "$block_domains" '
          .rules[0].domain_suffix = (((.rules[0].domain_suffix // []) + $block) | unique | sort)
        ' cleaned_awa.json > updated_awa.json

        jq --argjson version "$RULESET_VERSION" '
          .version = $version |
          .rules[0].domain = (if .rules[0].domain | length > 0 then .rules[0].domain | unique | sort else .rules[0].domain end) |
          .rules[0].domain_keyword = (if .rules[0].domain_keyword | length > 0 then .rules[0].domain_keyword | unique | sort else .rules[0].domain_keyword end)
        ' updated_awa.json > source/adg-awa.json
        rm AWAvenue.json cleaned_awa.json updated_awa.json

    - name: 9. 处理 adg-dns 规则
      continue-on-error: true
      run: |
        curl -sfL -o AWAvenue.json https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
        curl -sfL -o adblocksingbox.json https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksingbox.json

        jq -s --argjson version "$RULESET_VERSION" '
          {
            version: $version,
            rules: [
              {
                domain: ((.[0].rules[0].domain // []) + (.[1].rules[0].domain // []) | unique),
                domain_keyword: ((.[0].rules[0].domain_keyword // []) + (.[1].rules[0].domain_keyword // []) | unique),
                domain_suffix: ((.[0].rules[0].domain_suffix // []) + (.[1].rules[0].domain_suffix // []) | unique)
              }
            ]
          }
        ' AWAvenue.json adblocksingbox.json > merged_adg.json

        parse_list() {
            local file=$1
            local out_domain=$2
            local out_suffix=$3
            local current_mode="domain"
            
            touch "$out_domain" "$out_suffix"
            if [ ! -f "$file" ]; then return; fi
            
            while IFS= read -r line || [[ -n "$line" ]]; do
                line=$(echo "$line" | xargs)
                if [[ -z "$line" ]]; then continue; fi
                
                if [[ "${line,,}" == "domain:" || "${line,,}" == "domain：" ]]; then current_mode="domain"; continue; fi
                if [[ "${line,,}" == "domain_suffix:" || "${line,,}" == "domain_suffix：" ]]; then current_mode="suffix"; continue; fi
                
                if [[ "$current_mode" == "domain" ]]; then
                    echo "$line" >> "$out_domain"
                else
                    echo "$line" >> "$out_suffix"
                fi
            done < "$file"
        }

        parse_list "source/block.txt" "b_domain.txt" "b_suffix.txt"
        parse_list "source/noblock.txt" "nb_domain.txt" "nb_suffix.txt"

        b_d=$( [ -s b_domain.txt ] && jq -R -s -c 'split("\n")[:-1]' b_domain.txt || echo "[]" )
        b_s=$( [ -s b_suffix.txt ] && jq -R -s -c 'split("\n")[:-1]' b_suffix.txt || echo "[]" )
        nb_d=$( [ -s nb_domain.txt ] && jq -R -s -c 'split("\n")[:-1]' nb_domain.txt || echo "[]" )
        nb_s=$( [ -s nb_suffix.txt ] && jq -R -s -c 'split("\n")[:-1]' nb_suffix.txt || echo "[]" )
        
        nb_all=$(cat nb_domain.txt nb_suffix.txt 2>/dev/null | jq -R -s -c 'split("\n")[:-1] | map(select(length > 0))' || echo "[]")

        jq --argjson bd "$b_d" \
           --argjson bs "$b_s" \
           --argjson nbd "$nb_d" \
           --argjson nbs "$nb_s" \
           --argjson nball "$nb_all" '
          .rules[0].domain = (((.rules[0].domain // []) + $bd) | map(select(. as $d | $nbd | index($d) | not)) | unique | sort) |
          .rules[0].domain_suffix = (((.rules[0].domain_suffix // []) + $bs) | map(select(. as $d | $nbs | index($d) | not)) | unique | sort) |
          .rules[0].domain_keyword = ((.rules[0].domain_keyword // []) | map(select(. as $d | $nball | index($d) | not)) | unique | sort) |
          
          .rules[0] |= with_entries(select(.value | type == "array" and length > 0))
        ' merged_adg.json > source/adg-dns.json

        rm AWAvenue.json adblocksingbox.json merged_adg.json
        rm b_domain.txt b_suffix.txt nb_domain.txt nb_suffix.txt

    - name: 10. 处理 App 规则
      continue-on-error: true
      run: |
        curl -sfL -o applications.json https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/applications.json
        process_names=$(jq -R -s -c 'split("\n")[:-1]' source/process.txt)

        jq --argjson process "$process_names" --argjson version "$RULESET_VERSION" '
          .version = $version |
          .rules[0].process_name += $process |
          .rules[0].process_name = (if .rules[0].process_name | length > 0 then .rules[0].process_name | unique | sort else .rules[0].process_name end)
        ' applications.json > source/app.json
        rm applications.json

    - name: 11. 处理 CN 规则
      continue-on-error: true
      run: |
        curl -sfL -o upstream_cn.json https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/cn.json
        touch domain_list.txt suffix_list.txt
        current_mode="suffix"

        while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | xargs)
            if [[ -z "$line" ]]; then continue; fi

            if [[ "${line,,}" == "domain:" || "${line,,}" == "domain：" ]]; then
                current_mode="domain"
                continue
            fi

            if [[ "${line,,}" == "domain_suffix:" || "${line,,}" == "domain_suffix：" ]]; then
                current_mode="suffix"
                continue
            fi

            if [[ "$current_mode" == "domain" ]]; then
                echo "$line" >> domain_list.txt
            else
                echo "$line" >> suffix_list.txt
            fi
        done < source/cn.txt

        if [ -s domain_list.txt ]; then
            local_domains=$(jq -R -s -c 'split("\n")[:-1]' domain_list.txt)
        else
            local_domains="[]"
        fi

        if [ -s suffix_list.txt ]; then
            local_suffixes=$(jq -R -s -c 'split("\n")[:-1]' suffix_list.txt)
        else
            local_suffixes="[]"
        fi

        jq --argjson new_domains "$local_domains" --argjson new_suffixes "$local_suffixes" --argjson version "$RULESET_VERSION" '
          .version = $version |
          .rules[0].domain = (.rules[0].domain // []) + $new_domains |
          .rules[0].domain = (if .rules[0].domain | length > 0 then .rules[0].domain | unique | sort else .rules[0].domain end) |
          .rules[0].domain_suffix = (.rules[0].domain_suffix // []) + $new_suffixes |
          .rules[0].domain_suffix = (if .rules[0].domain_suffix | length > 0 then .rules[0].domain_suffix | unique | sort else .rules[0].domain_suffix end)
        ' upstream_cn.json > source/cn.json
        rm upstream_cn.json domain_list.txt suffix_list.txt

    - name: 12. 批量编译所有 JSON 为 SRS（逐文件容错）
      continue-on-error: true
      run: |
        echo "===== sing-box 版本 ====="
        sing-box version

        FAILED=0
        GENERATED=0
        for file in emby adg-awa adg-dns app cn; do
          if [ -f "source/$file.json" ]; then
            echo ">>> 编译 source/$file.json -> $file.srs"
            if sing-box rule-set compile --output "$file.srs" "source/$file.json" && [ -s "$file.srs" ]; then
              echo "✅ $file.srs OK（$(stat -c %s "$file.srs") 字节）"
              GENERATED=$((GENERATED+1))
            else
              echo "❌ $file.json 编译失败或产物为空"
              FAILED=1
            fi
          else
            echo "⚠️  跳过：source/$file.json 不存在"
          fi
        done

        echo "===== 编译汇总 ====="
        echo "成功 $GENERATED / 5"
        ls -lh *.srs 2>/dev/null || echo "（没有任何 .srs 生成！）"
        if [ "$FAILED" -ne 0 ]; then
          echo "存在失败项，请查看上方具体报错（最常见：sing-box 二进制不支持 rule-set v${{ env.RULESET_VERSION }}）"
        fi
        exit $FAILED

    - name: 13. 提交并推送更改
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        if ! ls *.srs >/dev/null 2>&1; then
          echo "⚠️  未检测到任何 .srs 文件，请查看第 12 步编译日志！"
        fi

        shopt -s nullglob
        # -f 强制添加：防止 .gitignore 把 *.srs 挡在提交外
        git add -f source/*.txt source/*.json *.srs
        shopt -u nullglob

        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update all routing rules (ruleset v${{ env.RULESET_VERSION }})"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # 跟随当前分支名，master/main 都能用
            git pull --rebase origin "${GITHUB_REF_NAME}"
            
            if git push; then
              SUCCESS=true
              break
            fi
            
            echo "推送遇到并发锁，3秒后进行第 $((RETRY_COUNT+1)) 次重试..."
            sleep 3
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "错误: 尝试推送 $MAX_RETRIES 次后仍然失败，请检查仓库状态。"
            exit 1
          fi
        else
          echo "No changes to commit"
        fi
