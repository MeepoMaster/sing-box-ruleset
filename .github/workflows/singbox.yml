name: Update Sing-box Remote Rulesets

on:
  schedule:
    - cron: '30 0,8,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/block.txt'
      - 'source/noblock.txt'
      - 'source/process.txt'
      - 'source/cn.txt'
      - 'source/emby.json'
      - 'scripts/build_rules.py'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SB_REPO: https://github.com/reF1nd/sing-box.git
  SB_BRANCH: reF1nd-testing
  RULESET_VERSION_MAX: '5'
  PRODUCTS: 'emby app adg-awa adg-dns cn'
  WHITELISTED: 'emby adg-awa adg-dns'
  BIG_ARRAY: '20000'
  AWA_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
  ADBLOCK_URL: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksingbox.json
  APPS_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/applications.json
  CN_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/cn.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: "${{ github.event_name != 'push' || (github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore: auto-update')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查构建脚本
        run: |
          set -euo pipefail
          if [ ! -f scripts/build_rules.py ]; then
            echo "❌ 缺少 scripts/build_rules.py，请先把构建脚本提交到仓库"
            exit 1
          fi
          python3 --version
          echo "构建脚本就绪"

      - name: 克隆 reF1nd sing-box 并记录提交
        id: sb
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$SB_BRANCH" "$SB_REPO" /tmp/sb
          echo "rev=$(git -C /tmp/sb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ steps.sb.outputs.rev }}
          restore-keys: gobuild-

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/sb/go.mod
          cache: false

      - name: 编译 sing-box 并探测支持的规则集版本
        run: |
          set -euo pipefail
          cd /tmp/sb
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o sing-box ./cmd/sing-box
          sudo install -m 0755 sing-box /usr/local/bin/sing-box
          sing-box version

          probe() {
            printf '{"version": %s, "rules": [{"domain": ["probe.example.com"], "domain_suffix": ["probe.example.com"], "domain_keyword": ["probe"], "ip_cidr": ["127.0.0.1"], "process_name": ["probe.exe"]}]}' "$1" > "$RUNNER_TEMP/probe.json"
            sing-box rule-set compile --output "$RUNNER_TEMP/probe.srs" "$RUNNER_TEMP/probe.json" >/dev/null 2>&1 && [ -s "$RUNNER_TEMP/probe.srs" ]
          }

          SUPPORTED=""
          for v in $(seq 1 "$RULESET_VERSION_MAX"); do
            if probe "$v"; then
              echo "  v$v ✅"
              SUPPORTED="$SUPPORTED $v"
            else
              echo "  v$v ❌"
            fi
            rm -f "$RUNNER_TEMP/probe.srs"
          done

          MAX=$(echo $SUPPORTED | tr ' ' '\n' | sort -n | tail -1)
          if [ -z "${MAX:-}" ]; then
            echo "❌ 该二进制不支持任何规则集版本（探测样本已含 process_name）"
            exit 1
          fi
          echo "本次生效版本：v$MAX"
          echo "EFFECTIVE_VERSION=$MAX" >> "$GITHUB_ENV"

      - name: 拉取上游规则集
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/up"
          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 120 -o "$dest.part" "$url" \
               && [ -s "$dest.part" ] && jq -e '(.rules | length) > 0' "$dest.part" >/dev/null 2>&1; then
              mv "$dest.part" "$dest"
              echo "✅ $(basename "$dest") ($(stat -c %s "$dest") 字节)"
            else
              rm -f "$dest.part"
              echo "⚠️ $(basename "$dest") 拉取或校验失败，将回退到上一次的产物"
            fi
          }
          fetch "$AWA_URL"     "$RUNNER_TEMP/up/awa.json"
          fetch "$ADBLOCK_URL" "$RUNNER_TEMP/up/adblock.json"
          fetch "$APPS_URL"    "$RUNNER_TEMP/up/applications.json"
          fetch "$CN_URL"      "$RUNNER_TEMP/up/cn.json"

      - name: 组装并归一化（只写临时目录）
        run: |
          set -euo pipefail
          python3 -u scripts/build_rules.py

      - name: 校验并落盘到 source/
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/build"

          if [ -f "$BUILD/summary.md" ]; then
            cat "$BUILD/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          bad=""
          for f in $PRODUCTS; do
            if [ ! -f "$BUILD/$f.json" ]; then
              echo "❌ 缺少 $BUILD/$f.json"
              bad="$bad $f"
              continue
            fi
            if ! jq -e '(.rules | length) > 0 and (.version != null)' "$BUILD/$f.json" > /dev/null 2>&1; then
              echo "❌ $f.json 校验失败"
              bad="$bad $f"
            fi
          done

          if [ -n "$bad" ]; then
            echo "存在校验失败产物：$bad"
            exit 1
          fi

          for f in $PRODUCTS; do
            mv "$BUILD/$f.json" "source/$f.json"
            echo "✅ source/$f.json"
          done

      - name: 编译为 SRS
        run: |
          set -euo pipefail
          echo "===== sing-box ====="
          sing-box version
          echo "===== 生效版本 v$EFFECTIVE_VERSION ====="
          {
            echo ""
            echo "### 编译结果"
            echo ""
            echo "| SRS | 大小(字节) | 结果 |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          for f in $PRODUCTS; do
            src="source/$f.json"
            if [ ! -f "$src" ]; then
              echo "❌ 缺少 $src"
              echo "| $f.srs | - | ❌ 源文件缺失 |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
              continue
            fi
            if sing-box rule-set compile --output "$f.srs" "$src" && [ -s "$f.srs" ]; then
              size=$(stat -c %s "$f.srs")
              echo "✅ $f.srs ($size 字节)"
              echo "| $f.srs | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $f 编译失败"
              echo "| $f.srs | - | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
            fi
          done

          if [ -n "$failed" ]; then
            echo "编译失败：$failed"
            exit 1
          fi

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          git add -f source/*.txt source/*.json ./*.srs
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: auto-update rulesets (v${EFFECTIVE_VERSION})"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "✅ 推送成功"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，3 秒后重试"
            sleep 3
          done
          echo "❌ 推送重试 5 次仍失败"
          exit 1
