name: Convert ChinaMax IP to SRS

on:
  schedule:
    - cron: '20 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  RULESET_VERSION: '5'   # 将来改 6/7/8 只改这一行

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream rule file
        run: |
          curl -fsSL -o ChinaMax_IP.txt \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.txt"
          echo "Downloaded $(wc -l < ChinaMax_IP.txt) lines"

      - name: Convert to sing-box JSON rule set
        run: python3 source/convert_cnip.py
        env:
          RULESET_VERSION: ${{ env.RULESET_VERSION }}

      - name: Clone reF1nd sing-box (testing branch)
        run: git clone --depth 1 -b reF1nd-testing https://github.com/reF1nd/sing-box.git /tmp/sb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/sb/go.mod
          cache: false

      - name: Build sing-box
        run: |
          cd /tmp/sb
          CGO_ENABLED=0 go build -trimpath -o sing-box ./cmd/sing-box
          ./sing-box version

      - name: Compile SRS
        run: |
          mkdir -p main
          /tmp/sb/sing-box rule-set compile source/cnip.json -o main/cnip.srs
          ls -lh main/cnip.srs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/cnip.json main/cnip.srs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ChinaMax IP rule set (v${{ env.RULESET_VERSION }}, $(date -u +%Y-%m-%d))"
            git push
          fi
