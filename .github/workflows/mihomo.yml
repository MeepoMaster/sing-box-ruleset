name: Update mihomo MRS Rulesets

on:
  schedule:
    - cron: '15 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/block.txt'
      - 'source/noblock.txt'
      - 'source/cn.txt'
      - 'source/emby.json'
      - 'scripts/build_rules.py'
      - 'scripts/build_mrs.py'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MH_REPO: https://github.com/MetaCubeX/mihomo.git
  MH_BRANCH: Alpha
  # 只用于给中间 JSON 盖章，mihomo 侧不参与编译
  EFFECTIVE_VERSION: "${{ vars.RULESET_VERSION || '5' }}"
  PRODUCTS: 'emby app adg-awa adg-dns cn'
  WHITELISTED: 'emby adg-awa adg-dns'
  PRODUCTS_DOMAIN: 'emby adg-awa adg-dns cn'
  BIG_ARRAY: '20000'
  IP_URL: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.txt
  AWA_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
  ADBLOCK_URL: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksingbox.json
  APPS_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/applications.json
  CN_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/cn.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: "${{ github.event_name != 'push' || (github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore: auto-update')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查构建脚本
        run: |
          set -euo pipefail
          for f in scripts/build_rules.py scripts/build_mrs.py; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺少 $f"
              exit 1
            fi
          done
          echo "构建脚本就绪"

      - name: 克隆 mihomo 并记录提交
        id: mh
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$MH_BRANCH" "$MH_REPO" /tmp/mh
          echo "rev=$(git -C /tmp/mh rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "MIHOMO_REV=$(git -C /tmp/mh rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "MIHOMO_DATE=$(git -C /tmp/mh log -1 --format=%cs)" >> "$GITHUB_ENV"

      - name: 恢复 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-mihomo-${{ steps.mh.outputs.rev }}
          restore-keys: gobuild-mihomo-

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/mh/go.mod
          cache: false

      - name: 编译 mihomo（禁止任何无参数调用）
        run: |
          set -euo pipefail
          cd /tmp/mh
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o mihomo .
          [ -x ./mihomo ] || { echo "❌ 编译产物不存在"; exit 1; }

          echo "mihomo@${MIHOMO_REV} (${MIHOMO_DATE})"
          echo "源码中可用子命令："
          grep -n 'case "' /tmp/mh/main.go | head -20 || echo "（main.go 未匹配到 case，可能已重构）"

          # 版本信息只用带超时的方式取；mihomo 没有 `version` 子命令，裸跑会启动服务
          rc=0
          timeout 10 ./mihomo -v > "$RUNNER_TEMP/mh_version.txt" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            head -5 "$RUNNER_TEMP/mh_version.txt" || true
          else
            echo "（-v 不可用，退出码 $rc，忽略——版本以 git 提交为准）"
          fi

      - name: convert-ruleset 能力自检
        run: |
          set -euo pipefail
          MH=/tmp/mh/mihomo
          cd "$RUNNER_TEMP"          # 万一误启动服务，配置只会落在临时目录

          # 1) 先看源码里有没有这个子命令（零执行风险）
          if ! grep -q 'convert-ruleset' /tmp/mh/main.go; then
            echo "❌ /tmp/mh/main.go 中没有 convert-ruleset 子命令"
            echo "可用子命令："
            grep -n 'case "' /tmp/mh/main.go | head -20 || true
            exit 1
          fi
          echo "✅ 源码中存在 convert-ruleset"

          # 2) 冒烟测试（必须套 timeout；退出码 124 = 说明落进了服务模式）
          printf '+.probe.example.com\nprobe.example.com\n' > probe.txt
          rc=0
          timeout 30 "$MH" convert-ruleset domain text probe.txt probe.mrs || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "❌ 自检转换失败，退出码 $rc"
            if [ "$rc" -eq 124 ]; then
              echo "   → 124 表示命令超时：极可能是子命令/参数形式不对，mihomo 转去启动服务了"
            fi
            exit 1
          fi
          [ -s probe.mrs ] || { echo "❌ 自检产物 probe.mrs 为空"; exit 1; }
          echo "✅ 自检通过（$(stat -c %s probe.mrs) 字节）"

      - name: 拉取上游规则集
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/up"
          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 120 -o "$dest.part" "$url" \
               && [ -s "$dest.part" ] && jq -e '(.rules | length) > 0' "$dest.part" >/dev/null 2>&1; then
              mv "$dest.part" "$dest"
              echo "✅ $(basename "$dest") ($(stat -c %s "$dest") 字节)"
            else
              rm -f "$dest.part"
              echo "⚠️ $(basename "$dest") 拉取或校验失败，将回退到上一次的产物"
            fi
          }
          fetch "$AWA_URL"     "$RUNNER_TEMP/up/awa.json"
          fetch "$ADBLOCK_URL" "$RUNNER_TEMP/up/adblock.json"
          fetch "$APPS_URL"    "$RUNNER_TEMP/up/applications.json"
          fetch "$CN_URL"      "$RUNNER_TEMP/up/cn.json"

      - name: 下载 ChinaMax IP
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/ChinaMax_IP.txt" "$IP_URL"
          lines=$(wc -l < "$RUNNER_TEMP/ChinaMax_IP.txt")
          echo "下载 $lines 行"
          if [ "$lines" -le 1000 ]; then
            echo "❌ 行数异常（$lines），上游可能已变更"
            exit 1
          fi

      - name: 组装规则集 JSON（与 sing-box 完全同源）
        run: |
          set -euo pipefail
          python3 -u scripts/build_rules.py

      - name: 转 mrs 中间文本
        run: |
          set -euo pipefail
          python3 -u scripts/build_mrs.py

      - name: 生成 mrs（每次调用都套 timeout + 校验产物）
        run: |
          set -euo pipefail
          MH=/tmp/mh/mihomo
          MRS="$RUNNER_TEMP/mrs"
          cd "$RUNNER_TEMP"

          {
            echo ""
            echo "### mihomo MRS（mihomo@${MIHOMO_REV:-unknown} ${MIHOMO_DATE:-}）"
            echo ""
            echo "| MRS | 类型 | 大小(字节) | 结果 |"
            echo "| --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""

          for f in $PRODUCTS_DOMAIN; do
            src="$MRS/$f.txt"
            dst="$MRS/$f.mrs"
            if [ ! -f "$src" ]; then
              echo "❌ 缺少中间文件 $src"
              echo "| $f.mrs | domain | - | ❌ 缺少中间文件 |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
              continue
            fi
            rc=0
            timeout 120 "$MH" convert-ruleset domain text "$src" "$dst" || rc=$?
            if [ "$rc" -eq 0 ] && [ -s "$dst" ]; then
              size=$(stat -c %s "$dst")
              echo "✅ $f.mrs ($size 字节)"
              echo "| $f.mrs | domain | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $f.mrs 生成失败（退出码 $rc$([ "$rc" -eq 124 ] && echo '，超时')）"
              echo "| $f.mrs | domain | - | ❌ 退出码 $rc |" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$dst"
              failed="$failed $f"
            fi
          done

          rc=0
          timeout 120 "$MH" convert-ruleset ipcidr text "$MRS/cnip.txt" "$MRS/cnip.mrs" || rc=$?
          if [ "$rc" -eq 0 ] && [ -s "$MRS/cnip.mrs" ]; then
            size=$(stat -c %s "$MRS/cnip.mrs")
            echo "✅ cnip.mrs ($size 字节)"
            echo "| cnip.mrs | ipcidr | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ cnip.mrs 生成失败（退出码 $rc）"
            echo "| cnip.mrs | ipcidr | - | ❌ 退出码 $rc |" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$MRS/cnip.mrs"
            failed="$failed cnip"
          fi

          if [ -n "$failed" ]; then
            echo "生成失败：$failed"
            exit 1
          fi

      - name: 落盘（先整体校验，再统一移动）
        run: |
          set -euo pipefail
          MRS="$RUNNER_TEMP/mrs"

          bad=""
          for f in $PRODUCTS_DOMAIN cnip; do
            if [ ! -s "$MRS/$f.mrs" ]; then
              echo "❌ 缺少或空文件：$MRS/$f.mrs"
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "产物不完整：$bad"
            exit 1
          fi

          for f in $PRODUCTS_DOMAIN cnip; do
            mv "$MRS/$f.mrs" "./$f.mrs"
            echo "✅ ./$f.mrs ($(stat -c %s "./$f.mrs") 字节)"
          done

          if [ -f "$RUNNER_TEMP/build/summary.md" ]; then
            cat "$RUNNER_TEMP/build/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          git add -f ./*.mrs
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: auto-update mihomo mrs rulesets (mihomo@${MIHOMO_REV:-unknown})"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "✅ 推送成功"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，3 秒后重试"
            sleep 3
          done
          echo "❌ 推送重试 5 次仍失败"
          exit 1
