name: Update mihomo MRS Rulesets

on:
  schedule:
    - cron: '15 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/block.txt'
      - 'source/noblock.txt'
      - 'source/cn.txt'
      - 'source/emby.json'
      - 'scripts/build_rules.py'
      - 'scripts/build_mrs.py'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MH_REPO: https://github.com/MetaCubeX/mihomo.git
  MH_BRANCH: Alpha
  # 只用于给中间 JSON 盖章，mihomo 侧不参与编译
  EFFECTIVE_VERSION: "${{ vars.RULESET_VERSION || '5' }}"
  PRODUCTS: 'emby app adg-awa adg-dns cn'
  WHITELISTED: 'emby adg-awa adg-dns'
  PRODUCTS_DOMAIN: 'emby adg-awa adg-dns cn'
  BIG_ARRAY: '20000'
  IP_URL: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.txt
  AWA_URL: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
  ADBLOCK_URL: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksingbox.json
  APPS_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/applications.json
  CN_URL: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset-compatible/cn.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: "${{ github.event_name != 'push' || (github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore: auto-update')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查构建脚本
        run: |
          set -euo pipefail
          for f in scripts/build_rules.py scripts/build_mrs.py; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺少 $f"
              exit 1
            fi
          done
          echo "构建脚本就绪"

      - name: 克隆 mihomo 并记录提交
        id: mh
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$MH_BRANCH" "$MH_REPO" /tmp/mh
          echo "rev=$(git -C /tmp/mh rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-mihomo-${{ steps.mh.outputs.rev }}
          restore-keys: gobuild-mihomo-

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/mh/go.mod
          cache: false

      - name: 编译 mihomo
        run: |
          set -euo pipefail
          cd /tmp/mh
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o mihomo .
          ./mihomo version
          echo "MIHOMO_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: convert-ruleset 自检
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mrs"
          printf '+.probe.example.com\nprobe.example.com\n' > "$RUNNER_TEMP/probe.txt"
          if ! /tmp/mh/mihomo convert-ruleset domain text "$RUNNER_TEMP/probe.txt" "$RUNNER_TEMP/probe.mrs"; then
            echo "❌ convert-ruleset 调用失败，以下是帮助信息："
            /tmp/mh/mihomo convert-ruleset -h || true
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/probe.mrs" ]; then
            echo "❌ 自检产物为空"
            exit 1
          fi
          echo "✅ convert-ruleset 自检通过（$(stat -c %s "$RUNNER_TEMP/probe.mrs") 字节）"

      - name: 拉取上游规则集
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/up"
          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 120 -o "$dest.part" "$url" \
               && [ -s "$dest.part" ] && jq -e '(.rules | length) > 0' "$dest.part" >/dev/null 2>&1; then
              mv "$dest.part" "$dest"
              echo "✅ $(basename "$dest") ($(stat -c %s "$dest") 字节)"
            else
              rm -f "$dest.part"
              echo "⚠️ $(basename "$dest") 拉取或校验失败，将回退到上一次的产物"
            fi
          }
          fetch "$AWA_URL"     "$RUNNER_TEMP/up/awa.json"
          fetch "$ADBLOCK_URL" "$RUNNER_TEMP/up/adblock.json"
          fetch "$APPS_URL"    "$RUNNER_TEMP/up/applications.json"
          fetch "$CN_URL"      "$RUNNER_TEMP/up/cn.json"

      - name: 下载 ChinaMax IP
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/ChinaMax_IP.txt" "$IP_URL"
          lines=$(wc -l < "$RUNNER_TEMP/ChinaMax_IP.txt")
          echo "下载 $lines 行"
          if [ "$lines" -le 1000 ]; then
            echo "❌ 行数异常（$lines）"
            exit 1
          fi

      - name: 组装规则集 JSON（与 sing-box 完全同源）
        run: |
          set -euo pipefail
          python3 -u scripts/build_rules.py

      - name: 转 mrs 中间文本
        run: |
          set -euo pipefail
          python3 -u scripts/build_mrs.py

      - name: 生成 mrs
        run: |
          set -euo pipefail
          MRS="$RUNNER_TEMP/mrs"
          {
            echo ""
            echo "### mihomo MRS（mihomo@${MIHOMO_REV}）"
            echo ""
            echo "| MRS | 类型 | 大小(字节) | 结果 |"
            echo "| --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=""
          for f in $PRODUCTS_DOMAIN; do
            if [ ! -f "$MRS/$f.txt" ]; then
              echo "❌ 缺少 $MRS/$f.txt"
              echo "| $f.mrs | domain | - | ❌ 缺少中间文件 |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
              continue
            fi
            if /tmp/mh/mihomo convert-ruleset domain text "$MRS/$f.txt" "$MRS/$f.mrs" && [ -s "$MRS/$f.mrs" ]; then
              size=$(stat -c %s "$MRS/$f.mrs")
              echo "✅ $f.mrs ($size 字节)"
              echo "| $f.mrs | domain | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $f.mrs 生成失败"
              echo "| $f.mrs | domain | - | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $f"
            fi
          done

          if /tmp/mh/mihomo convert-ruleset ipcidr text "$MRS/cnip.txt" "$MRS/cnip.mrs" && [ -s "$MRS/cnip.mrs" ]; then
            size=$(stat -c %s "$MRS/cnip.mrs")
            echo "✅ cnip.mrs ($size 字节)"
            echo "| cnip.mrs | ipcidr | $size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ cnip.mrs 生成失败"
            echo "| cnip.mrs | ipcidr | - | ❌ |" >> "$GITHUB_STEP_SUMMARY"
            failed="$failed cnip"
          fi

          if [ -n "$failed" ]; then
            echo "生成失败：$failed"
            exit 1
          fi

      - name: 落盘
        run: |
          set -euo pipefail
          MRS="$RUNNER_TEMP/mrs"
          for f in $PRODUCTS_DOMAIN cnip; do
            mv "$MRS/$f.mrs" "./$f.mrs"
            echo "✅ $f.mrs"
          done
          if [ -f "$RUNNER_TEMP/build/summary.md" ]; then
            cat "$RUNNER_TEMP/build/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          git add -f ./*.mrs
          shopt -u nullglob

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: auto-update mihomo mrs rulesets"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "✅ 推送成功"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，3 秒后重试"
            sleep 3
          done
          echo "❌ 推送重试 5 次仍失败"
          exit 1
